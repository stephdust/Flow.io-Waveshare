name: Build ESP32 HMI RSSI (Flow.io Waveshare)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/flowio-hmi-rssi-build.yml'
      - 'src/Core/Services/IWifi.h'
      - 'src/Modules/Network/WifiModule/WifiModule.h'
      - 'src/Modules/Network/WifiModule/WifiModule.cpp'
      - 'src/Modules/HMIModule/HMIModule.cpp'
      - 'scripts/tests/test_nextion_wifi_rssi.py'
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout firmware (fork dev)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11 for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate RSSI protocol / compatibility
        run: python scripts/tests/test_nextion_wifi_rssi.py
      - name: Install PlatformIO Core
        run: python -m pip install 'platformio>=6.2,<7'
      - name: Select last Arduino-ESP32 3.x platform for this CI build
        shell: bash
        run: |
          set -euo pipefail
          # Stable now resolves to Arduino-ESP32 4.0.0, which cannot compile
          # OneWireNg 0.14.1 (GPIO register API removed upstream).
          # Override only on the disposable CI runner until app migration.
          sed -i 's|^platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip|platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip|' platformio.ini
          grep -F 'platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip' platformio.ini
      - name: Compile Waveshare ESP32-S3 firmware (without re-building the Nextion)
        run: pio run -e Flowio-waveshare-esp32-s3
      - name: Verify that firmware binary exists
        shell: bash
        run: |
          test -f .pio/build/Flowio-waveshare-esp32-s3/firmware.bin
          ls -lh .pio/build/Flowio-waveshare-esp32-s3/firmware.bin
          echo "ESP32-S3 firmware compilation succeeded." >> "$GITHUB_STEP_SUMMARY"
      - name: Save firmware build for hardware testing
        uses: actions/upload-artifact@v4
        with:
          name: FlowIO-Waveshare-HMI-RSSI-firmware
          path: |
            .pio/build/Flowio-waveshare-esp32-s3/firmware.bin
            binary/manifest.json
          if-no-files-found: warn
          retention-days: 7
