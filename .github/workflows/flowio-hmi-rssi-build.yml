name: Build ESP32 HMI RSSI (Flow.io Waveshare)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/flowio-hmi-rssi-build.yml'
      - 'src/Core/Services/IWifi.h'
      - 'src/Modules/Network/WifiModule/WifiModule.h'
      - 'src/Modules/Network/WifiModule/WifiModule.cpp'
      - 'src/Modules/HMIModule/HMIModule.cpp'
      - 'scripts/tests/test_nextion_wifi_rssi.py'
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout firmware (fork dev)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11 for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate RSSI protocol / compatibility
        run: python scripts/tests/test_nextion_wifi_rssi.py
      - name: Install PlatformIO Core
        run: python -m pip install 'platformio>=6.2,<7'
      - name: Verify the tested Arduino-ESP32 3.3.13 platform is pinned
        run: grep -F 'platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip' platformio.ini
      - name: Compile Waveshare ESP32-S3 firmware (without re-building the Nextion)
        run: pio run -e Flowio-waveshare-esp32-s3
      - name: Verify full paired firmware + SPIFFS release and Nextion export
        shell: bash
        run: |
          set -euo pipefail
          test -f .pio/build/Flowio-waveshare-esp32-s3/firmware.bin
          test -f .pio/build/Flowio-waveshare-esp32-s3/spiffs.bin
          test -s binary/flowios3-2026.11.1.bin
          test -s binary/flowios3-spiffs-2026.11.1.bin
          test -s binary/flowio-2026.11.1.zip
          test -s binary/flowio-release-2026.11.1.json
          test -s binary/release.json
          test -s binary/manifest.json
          test -s binary/FlowIO_Nextion_NX4832K035_011-7.0.0.tft
          echo "ESP32-S3 and SPIFFS paired OTA release built successfully." >> "$GITHUB_STEP_SUMMARY"
          du -h binary/* | sort -h
      - name: Save firmware build for hardware testing
        uses: actions/upload-artifact@v4
        with:
          name: FlowIO-Waveshare-HMI-RSSI-paired-OTA-2026.11.1
          path: |
            binary/
            .pio/build/Flowio-waveshare-esp32-s3/firmware.bin
          if-no-files-found: warn
          retention-days: 7
