name: Nxwright audit - NX4832K035 HMI 7.0.0 (read only)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/nextion-nxwright-audit.yml'
      - 'nextion/tools/audit_3p5_nxwright.py'
      - 'nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI'

permissions:
  contents: read

concurrency:
  group: flowio-nextion-nxwright-7-0-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev in read-only mode
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned nxwright in temporary runner
        run: |
          python -m pip install --no-cache-dir 'git+https://github.com/nixiewright/nxwright.git@e9443a409cc9deb866db7486854fa962d382accc'
          python -m pip show nxwright
      - name: Fetch field-tested 7.0.0 source as a read-only baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin backup/nextion-v7-validated-20261127
          git show FETCH_HEAD:nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI > "$RUNNER_TEMP/NX4832K035-7.0.0-baseline.HMI"
          test "$(git hash-object "$RUNNER_TEMP/NX4832K035-7.0.0-baseline.HMI")" = 'ac941badd17a3f0b8d27da4a29cc5135d5a0986c'
          sha256sum "$RUNNER_TEMP/NX4832K035-7.0.0-baseline.HMI" nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
      - name: Run nxwright extract, check, build, diff and report on both HMI files
        shell: bash
        run: |
          python nextion/tools/audit_3p5_nxwright.py \
            --baseline "$RUNNER_TEMP/NX4832K035-7.0.0-baseline.HMI" \
            --current nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI \
            --output .nxwright-audit/results
      - name: Present compatibility results
        if: always()
        shell: bash
        run: |
          if test -f .nxwright-audit/results/SUMMARY.md; then
            cat .nxwright-audit/results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive logs and compatibility reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nextion-NX4832K035-7.0.0-NXWRIGHT-AUDIT
          path: .nxwright-audit/results/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify that no tracked source or TFT file was modified
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
