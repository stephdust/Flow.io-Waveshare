name: Verify HMI ConfigStore tree and ESP32 firmware (all Nextion sizes)
on:
  workflow_dispatch:
  push:
    branches: [dev, experiment/nextion-full-row-2s-reboot-20261128]
    paths:
      - '.github/workflows/hmi-config-hierarchy.yml'
      - 'scripts/tests/test_hmi_config_hierarchy.py'
      - 'src/Modules/HMIModule/Drivers/NextionDriver.cpp'
      - 'scripts/tests/test_hmi_udp_remote_compat.py'
      - 'scripts/tests/apply_remote_display_menu_patch.py'
      - 'src/Core/Hmi/HmiUdpConfigTitle.h'
      - 'src/Modules/Network/HmiUdpServerModule/HmiUdpServerModule.cpp'
      - 'src/Modules/HMIModule/HMIModule.cpp'
      - 'scripts/generate_hmi_config_paths.py'
      - 'scripts/prepare_spiffs_data.py'
      - 'src/Modules/HMIModule/ConfigMenuPaths.h'
      - 'src/Modules/HMIModule/ConfigMenuModel.cpp'
      - 'src/Modules/HMIModule/ConfigMenuModel.h'
      - 'src/Modules/Network/ModbusTcpServerModule/ModbusTcpServerModule.cpp'
      - 'src/Modules/Network/ModbusTcpServerModule/ModbusTcpServerModule.h'
      - 'src/Modules/Network/ModbusTcpServerModule/text/cfgdocs.fr.json'
      - 'src/Modules/Network/WifiModule/text/cfgmods.fr.json'
      - 'src/Modules/**/text/cfgmods.fr.json'
      - 'data/webinterface/app.js'
      - 'platformio.ini'
permissions:
  contents: read

jobs:
  verify-config-hierarchy:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate the Web tree once and validate Nextion C++/MQTT/HA parity
        run: python scripts/tests/test_hmi_config_hierarchy.py
      - name: Install PlatformIO with pinned firmware environment
        run: python -m pip install 'platformio>=6.2,<7'
      - name: Compile real Flow.io ESP32-S3 firmware
        run: pio run -e Flowio-waveshare-esp32-s3
      - name: Confirm compiled firmware exists
        run: test -s .pio/build/Flowio-waveshare-esp32-s3/firmware.bin
      - name: Checkout the real RemoteDisplay repository (without writing to it)
        uses: actions/checkout@v4
        with:
          repository: stephdust/Flow.io-RemoteDisplay
          ref: main
          path: remote-display
          persist-credentials: false
      - name: Assert UDP protocol and native C++ title formatting match both firmwares
        run: python scripts/tests/test_hmi_udp_remote_compat.py --remote-root remote-display
      - name: Apply proposed compatibility patch to temporary RemoteDisplay checkout
        run: python scripts/tests/apply_remote_display_menu_patch.py --remote-root remote-display --apply
      - name: Verify the patched Nextion 6.0.0/7.0.0 UART renderer and context events
        run: python scripts/tests/test_hmi_udp_remote_compat.py --remote-root remote-display --patched
      - name: Compile real FlowConnectDisplay ESP32 firmware (temporary checkout)
        working-directory: remote-display
        run: pio run -e FlowConnectDisplay
      - name: Confirm compiled remote-display firmware exists
        run: test -s remote-display/.pio/build/FlowConnectDisplay/firmware.bin
