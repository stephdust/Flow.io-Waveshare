name: Publish Nextion 3.5in HMI 7.0.0 test

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/nextion-7-hmi-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hmi:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - name: In-place patch the 6.0.0 HMI to 7.0.0 without resizing resources
        run: python3 nextion/tools/build_3p5_v7_hmi.py
      - name: Print file fingerprint
        run: sha256sum nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
      - name: Publish test HMI as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nextion-NX4832K035-HMI-7.0.0-CRC-FIX
          path: nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
          retention-days: 7
      - name: Commit HMI to dev
        shell: bash
        run: |
          set -euo pipefail
          git add -- nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
          if git diff --cached --quiet; then
            echo 'HMI unchanged; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(nextion): add CRC-fixed NX4832K035 HMI 7.0.0 test [skip ci]'
          git push origin HEAD:dev
      # Independent 7.1.0 TEST build. 7.0.0 remains the known-good fallback.
      - name: Install PNG atlas authoring dependencies
        run: python3 -m pip install 'Pillow>=10,<12' 'numpy>=1.26,<3'
      - name: Generate 7.1.0 experimental Home redesign from the 7.0.0 HMI
        run: |
          python3 nextion/tools/build_3p5_v7_1_experimental.py \
            --source nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI \
            --out nextion/releases/7.1.0/FlowIO_Nextion_NX4832K035_011-7.1.0.HMI \
            --logo data/webinterface/logo-flowio.png \
            --preview nextion/releases/7.1.0/preview.png
      - name: Archive 7.1.0 experimental HMI and preview
        uses: actions/upload-artifact@v4
        with:
          name: Nextion-NX4832K035-HMI-7.1.0-EXPERIMENTAL
          path: |
            nextion/releases/7.1.0/FlowIO_Nextion_NX4832K035_011-7.1.0.HMI
            nextion/releases/7.1.0/preview.png
          retention-days: 14
      - name: Publish 7.1.0 experimental HMI on dev
        run: |
          git add -- nextion/releases/7.1.0/FlowIO_Nextion_NX4832K035_011-7.1.0.HMI nextion/releases/7.1.0/preview.png
          if git diff --cached --quiet; then
            echo '7.1.0 unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(nextion): generate experimental 7.1.0 modern Home HMI [skip ci]'
          git push origin HEAD:dev
