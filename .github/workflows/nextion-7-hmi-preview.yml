name: Archive previously validated Nextion 3.5in HMI 7.0.0 source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hmi:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - name: In-place patch the 6.0.0 HMI to 7.0.0 without resizing resources
        run: python3 nextion/tools/build_3p5_v7_hmi.py
      - name: Print file fingerprint
        run: sha256sum nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
      - name: Publish test HMI as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nextion-NX4832K035-HMI-7.0.0-CRC-FIX
          path: nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
          retention-days: 7
