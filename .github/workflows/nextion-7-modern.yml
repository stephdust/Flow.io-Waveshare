name: Publish modern Nextion 3.5in HMI 7.0.0 (source only)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/nextion-7-modern.yml'
      - 'nextion/scripts/build_3p5_v7_modern.py'
      - 'nextion/scripts/validate_3p5_v7_modern.py'

permissions:
  contents: write

concurrency:
  group: flowio-nextion-7-modern-dev
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current dev (never modify 5-inch / 7-inch sources)
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - name: Load verified 7.0.0 baseline from immutable backup branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin backup/nextion-v7-validated-20261127
          git show FETCH_HEAD:nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI > "$RUNNER_TEMP/Nextion-v7-validated.HMI"
          sha256sum "$RUNNER_TEMP/Nextion-v7-validated.HMI"
      - name: Install PNG rendering dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12' 'numpy>=1.26,<3'
      - name: Build modern NX4832K035_011 HMI — still version 7.0.0
        shell: bash
        run: |
          python nextion/scripts/build_3p5_v7_modern.py \
            --source "$RUNNER_TEMP/Nextion-v7-validated.HMI" \
            --out nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI \
            --logo data/webinterface/logo-flowio.png \
            --preview nextion/releases/7.0.0/preview-modern.png
      - name: Verify resource integrity, scope and unchanged version stamp
        shell: bash
        run: |
          python nextion/scripts/validate_3p5_v7_modern.py \
            --original "$RUNNER_TEMP/Nextion-v7-validated.HMI" \
            --modern nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
          sha256sum nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
          # Never commit or rewrite any 5-inch / 7-inch resource or compiled TFT.
          test -z "$(git diff --name-only -- 'nextion/releases/6.0.0/*NX8048*' 'nextion/releases/7.0.0/*.tft' 'platformio.ini')"
      - name: Archive modern HMI + preview for Nextion Editor testing
        uses: actions/upload-artifact@v4
        with:
          name: Nextion-NX4832K035-7.0.0-MODERN-HMI
          path: |
            nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
            nextion/releases/7.0.0/preview-modern.png
          retention-days: 14
      - name: Publish only NX4832K035 7.0.0 HMI and preview to dev
        shell: bash
        run: |
          set -euo pipefail
          git add -- nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI nextion/releases/7.0.0/preview-modern.png
          if git diff --cached --quiet; then
            echo 'Modern 7.0.0 HMI unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(nextion): apply modern 480x320 Home design to HMI 7.0.0 [skip ci]'
          git push origin HEAD:dev
