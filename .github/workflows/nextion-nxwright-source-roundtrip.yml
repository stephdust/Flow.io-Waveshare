name: Nextion 7.0.0 extract editable source (NX4832K035 only)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/nextion-nxwright-source-roundtrip.yml'
      - 'nextion/scripts/compile_nxwright_test.sh'

permissions:
  contents: read

jobs:
  extract:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned nxwright
        run: |
          python -m pip install --no-cache-dir 'git+https://github.com/nixiewright/nxwright.git@e9443a409cc9deb866db7486854fa962d382accc'
      - name: Read working Nextion 7.0.0 (backed up)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin backup/nextion-v7-validated-20261127
          git show FETCH_HEAD:nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI > "$RUNNER_TEMP/validated.HMI"
          test "$(git hash-object "$RUNNER_TEMP/validated.HMI")" = 'ac941badd17a3f0b8d27da4a29cc5135d5a0986c'
      - name: Decompile validated working HMI to editable source
        shell: bash
        run: |
          set -euo pipefail
          nxwright extract "$RUNNER_TEMP/validated.HMI" "$RUNNER_TEMP/nx-source"
          nxwright check "$RUNNER_TEMP/nx-source"
          nxwright build "$RUNNER_TEMP/nx-source" "$RUNNER_TEMP/roundtrip.HMI" --no-lock
          nxwright diff "$RUNNER_TEMP/nx-source" "$RUNNER_TEMP/roundtrip.HMI" --no-lock > "$RUNNER_TEMP/roundtrip-diff.txt"
          find "$RUNNER_TEMP/nx-source" -maxdepth 3 -type f | sort > "$RUNNER_TEMP/source-files.txt"
          cat "$RUNNER_TEMP/nx-source/app.toml" > "$GITHUB_STEP_SUMMARY"
          printf '\nNX4832K035 source extraction, check and rebuild successful. Not uploaded to any Nextion.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Experimental nxwright compile from extracted 7.0.0 (NOT production)
        shell: bash
        run: |
          set -euo pipefail
          echo "This is an experimental NX4832K035 build, not a release artifact."
          echo "Archived TFT uses Nextion Editor 1.68.1; nxwright 0.5.6 requires the official 1.68.2 firmware."
          echo "Explicitly allow nxwright to download the matching 1.68.2 editor firmware on this ephemeral runner."
          bash nextion/scripts/compile_nxwright_test.sh \
            "$RUNNER_TEMP/nx-source" \
            "$RUNNER_TEMP/NX4832K035-7.0.0-NXWRIGHT-TEST-ONLY.tft" \
            2>&1 | tee "$RUNNER_TEMP/nxwright-compile.log"
          sha256sum "$RUNNER_TEMP/NX4832K035-7.0.0-NXWRIGHT-TEST-ONLY.tft" \
            > "$RUNNER_TEMP/nxwright-compiled-sha256.txt"
          nxwright tft-read "$RUNNER_TEMP/NX4832K035-7.0.0-NXWRIGHT-TEST-ONLY.tft" \
            > "$RUNNER_TEMP/nxwright-tft-inspection.txt"
          echo "Experimental TFT compiled and parsed; real Nextion Editor/device validation still required." >> "$GITHUB_STEP_SUMMARY"
      - name: Archive experimental TFT and compile diagnostics (NOT a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NX4832K035-7.0.0-NXWRIGHT-TFT-EXPERIMENTAL-DO-NOT-INSTALL
          path: |
            ${{ runner.temp }}/NX4832K035-7.0.0-NXWRIGHT-TEST-ONLY.tft
            ${{ runner.temp }}/nxwright-compile.log
            ${{ runner.temp }}/nxwright-compiled-sha256.txt
            ${{ runner.temp }}/nxwright-tft-inspection.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload extracted editable Nextion 7.0.0 project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NX4832K035-7.0.0-NXWRIGHT-EXTRACTED-SOURCE
          path: |
            ${{ runner.temp }}/nx-source/
            ${{ runner.temp }}/roundtrip-diff.txt
            ${{ runner.temp }}/source-files.txt
          retention-days: 14
      - name: Ensure repository unchanged
        if: always()
        run: git diff --exit-code
