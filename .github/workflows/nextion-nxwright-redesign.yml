name: Build Nextion 7.0.0 with PlatformIO nxwright (NX4832K035 only)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/nextion-nxwright-redesign.yml'
      - 'platformio.ini'
      - 'nextion/scripts/pio_nextion_targets.py'
      - 'nextion/scripts/run_nextion.py'
      - 'nextion/scripts/render_nx_home.py'
      - 'nextion/scripts/test_nextion_animation.py'
      - 'nextion/scripts/test_nextion_gauges.py'
      - 'nextion/scripts/test_nextion_picture_refs.py'
      - 'nextion/scripts/test_nextion_page_navigation.py'
      - 'nextion/scripts/test_nextion_outdoor_temp.py'
      - 'nextion/scripts/test_nextion_footer_touch.py'
      - 'nextion/scripts/test_nextion_turbine_3d.py'
      - 'nextion/scripts/test_nextion_preview_layout.py'
      - 'nextion/scripts/test_nextion_wake.py'
      - 'scripts/tests/test_nextion_wifi_rssi.py'
      - 'nextion/scripts/refresh_nextion_manifest.py'
      - 'nextion/tests/NX4832K035_011/7.0.0/source/**'
permissions:
  contents: write
concurrency:
  group: flowio-nextion-platformio-build-7-0
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'stephdust/Flow.io-Waveshare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core only
        run: python -m pip install 'platformio>=6.2,<7'
      - name: Validate Home wake/redraw source contract
        run: |
          python nextion/scripts/test_nextion_wake.py
          python nextion/scripts/test_nextion_animation.py
          python nextion/scripts/test_nextion_gauges.py
          python nextion/scripts/test_nextion_picture_refs.py
          python nextion/scripts/test_nextion_page_navigation.py
          python nextion/scripts/test_nextion_outdoor_temp.py
          python nextion/scripts/test_nextion_footer_touch.py
          python scripts/tests/test_nextion_wifi_rssi.py
          python -m py_compile nextion/scripts/render_nx_home.py
      - name: Seed obsolete previews to verify automatic cleanup
        run: |
          mkdir -p binary .pio/nextion-output
          printf 'obsolete preview' > binary/nextion-preview.png
          printf 'obsolete preview' > .pio/nextion-output/preview.png
          mkdir -p .pio/nextion-output/NX4832K035_011/7.0.0
          printf 'obsolete preview' > .pio/nextion-output/NX4832K035_011/7.0.0/preview.png
      - name: Compile nxwright HMI/TFT and refresh manifest via single PlatformIO env
        run: pio run -e nextion
      - name: Validate release, manifest and model without touching ESP32/SPIFFS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          name = 'FlowIO_Nextion_NX4832K035_011-7.0.0.tft'
          source_dir = Path('nextion/tests/NX4832K035_011/7.0.0/source')
          compiled = Path('.pio/nextion-output')
          assert (source_dir / 'pages/pageHome.nx').is_file()
          assert (compiled / 'FlowIO_Nextion_NX4832K035_011-7.0.0.HMI').stat().st_size > 1000000
          tft = compiled / name
          assert (compiled / 'NX4832K035_011/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.png').stat().st_size > 4096
          assert not (compiled / 'NX4832K035_011/7.0.0/preview.png').exists()
          assert not (Path('binary') / 'nextion-preview.png').exists()
          assert not (compiled / 'preview.png').exists()
          assert (compiled / 'picture-0003.png').stat().st_size > 4096
          copied = Path('binary') / name
          assert tft.stat().st_size > 1000000
          assert tft.read_bytes() == copied.read_bytes()
          entries = json.loads(Path('binary/manifest.json').read_text(encoding='utf-8'))['artifacts']['nextion']
          assert len(entries) == 1
          e = entries[0]
          assert e['path'] == name and e['version'] == '7.0.0'
          assert e['display_compatibility'] == 'NX4832K035_011'
          assert e['size'] == tft.stat().st_size
          assert e['sha256'] == hashlib.sha256(tft.read_bytes()).hexdigest()
          assert not any(Path('binary').glob('*.bin'))
          print('PASS: PlatformIO Nextion-only HMI/TFT compile and manifest')
          PY
          test -z "$(git diff --name-only -- 'nextion/releases/6.0.0/*NX8048*')"
      - name: Ensure local build does not dirty tracked Nextion assets
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PASS: pio run -e nextion leaves tracked HMI, TFT, preview and atlas untouched"
      - name: Store compiled nxwright Nextion outputs as test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NX4832K035-7.0.0-PLATFORMIO-NXWRIGHT
          path: |
            .pio/nextion-output/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
            .pio/nextion-output/FlowIO_Nextion_NX4832K035_011-7.0.0.tft
            .pio/nextion-output/NX4832K035_011/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.png
            .pio/nextion-output/picture-0003.png
            binary/manifest.json
          include-hidden-files: true
          retention-days: 14
      - name: Commit NX4832K035 source images + preview + HMI/TFT on fork dev
        shell: bash
        run: |
          set -euo pipefail
          # Only the CI release step promotes the ignored build outputs
          # into version-controlled release artifacts. A plain local pio run
          # never modifies these four tracked files.
          cp .pio/nextion-output/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI nextion/releases/7.0.0/
          cp .pio/nextion-output/FlowIO_Nextion_NX4832K035_011-7.0.0.tft nextion/releases/7.0.0/
          cp .pio/nextion-output/picture-0003.png nextion/tests/NX4832K035_011/7.0.0/source/pictures/
          cp .pio/nextion-output/NX4832K035_011/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.png nextion/tests/NX4832K035_011/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.png
          cp .pio/nextion-output/NX4832K035_011/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.png nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.png
          git add -- nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.HMI
          git add -- nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.tft
          git add -- nextion/tests/NX4832K035_011/7.0.0/source/pictures/picture-0003.png
          git add -- nextion/tests/NX4832K035_011/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.png
          git add -- nextion/releases/7.0.0/FlowIO_Nextion_NX4832K035_011-7.0.0.png
          if git diff --cached --quiet; then
            echo "Both generated HMI and TFT match the current fork dev."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(nextion): compile NX4832K035 7.0.0 via PlatformIO nxwright [skip ci]'
            # A documentation/artifact-only commit can land while CI builds.
            # Incorporate it rather than failing non-fast-forward. However,
            # NEVER publish binaries built from outdated Nextion source.
            git fetch origin dev
            if ! git diff --quiet "$GITHUB_SHA" origin/dev -- \
              .github/workflows/nextion-nxwright-redesign.yml \
              platformio.ini nextion/scripts/ \
              nextion/tests/NX4832K035_011/7.0.0/source/ \
              scripts/tests/test_nextion_wifi_rssi.py; then
              echo "::error::Nextion build inputs changed during CI; refuse stale release promotion."
              exit 1
            fi
            git rebase origin/dev
            git push origin HEAD:dev
          fi
          echo "Nextion PlatformIO build succeeded; no production hardware validation claimed." >> "$GITHUB_STEP_SUMMARY"
